name: Sync Fork

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync TexasHODL with Block52
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo sync TexasHODL/ui \
            --source block52/ui \
            --branch main
