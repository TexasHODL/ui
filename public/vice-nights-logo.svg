<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="vn-logo-title vn-logo-desc">
  <title id="vn-logo-title">Texas HODL</title>
  <desc id="vn-logo-desc">Original neon outline wordmark for the Vice Nights table: TEXAS in pink, HODL in cyan, a small neon palm and a thin underline. No third-party marks.</desc>
  <defs>
    <filter id="vn-pink-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="vn-cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="vn-under" gradientUnits="userSpaceOnUse" x1="64" y1="312" x2="696" y2="312">
      <stop offset="0" stop-color="#ff2ec4"/>
      <stop offset="0.55" stop-color="#2de2ff"/>
      <stop offset="1" stop-color="#2de2ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- TEXAS -->
  <g transform="translate(46,28) skewX(-16)" filter="url(#vn-pink-glow)" fill="none" stroke="#ff2ec4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- T -->
    <path d="M6 16H92M49 16V108"/>
    <!-- E -->
    <path d="M118 16V108M118 16H196M118 62H182M118 108H196"/>
    <!-- X -->
    <path d="M224 16L304 108M304 16L224 108"/>
    <!-- A -->
    <path d="M328 108L372 16L416 108M348 74H396"/>
    <!-- S -->
    <path d="M490 34C484 12 424 10 420 38C417 58 444 64 464 70C496 80 502 98 476 110C450 124 412 114 416 90"/>
  </g>
  <!-- HODL -->
  <g transform="translate(86,158) skewX(-16)" filter="url(#vn-cyan-glow)" fill="none" stroke="#2de2ff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- H -->
    <path d="M8 8V108M88 8V108M8 58H88"/>
    <!-- O -->
    <path d="M154 8C196 8 210 32 210 58C210 84 196 108 154 108C112 108 98 84 98 58C98 32 112 8 154 8Z"/>
    <!-- D -->
    <path d="M234 8V108M234 8H268C314 8 326 32 326 58C326 84 314 108 268 108H234"/>
    <!-- L -->
    <path d="M350 8V108H430"/>
  </g>
  <!-- Small neon palm to the right of HODL -->
  <g transform="translate(590,96)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#vn-cyan-glow)" stroke="#2de2ff" stroke-width="5">
      <path d="M36 176C34 120 38 72 40 28"/>
    </g>
    <g filter="url(#vn-pink-glow)" stroke="#ff2ec4" stroke-width="5">
      <path d="M40 48C8 28-8 40-16 68"/>
      <path d="M40 42C18 8-4 0-20 18"/>
      <path d="M40 48C72 28 88 40 96 68"/>
      <path d="M40 42C62 8 84 0 100 18"/>
    </g>
    <g filter="url(#vn-cyan-glow)" stroke="#2de2ff" stroke-width="4">
      <path d="M40 58C22 58 8 74 4 96"/>
      <path d="M40 58C58 58 72 74 76 96"/>
    </g>
  </g>
  <!-- Underline -->
  <path d="M64 312H696" stroke="url(#vn-under)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M64 312H696" stroke="url(#vn-under)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#vn-pink-glow)" opacity="0.9"/>
</svg>
