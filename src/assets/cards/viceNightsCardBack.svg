<svg xmlns="http://www.w3.org/2000/svg" width="435" height="600" viewBox="0 0 435 600" role="img" aria-labelledby="vn-back-title vn-back-desc">
  <title id="vn-back-title">Vice Nights card back</title>
  <desc id="vn-back-desc">Dark playing-card back with a neon pink rounded border and a pink palm beside a smaller teal palm over neon horizon lines. Original Texas HODL artwork; no third-party marks.</desc>
  <defs>
    <filter id="vn-b-pink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vn-b-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vn-b-wash" cx="50%" cy="70%" r="60%">
      <stop offset="0" stop-color="#ff2ec4" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#3a1070" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#05060f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="435" height="600" rx="36" fill="#07091a"/>
  <rect width="435" height="600" rx="36" fill="url(#vn-b-wash)"/>
  <rect x="18" y="18" width="399" height="564" rx="26" fill="none" stroke="#ff2ec4" stroke-width="8" filter="url(#vn-b-pink)"/>
  <rect x="32" y="32" width="371" height="536" rx="20" fill="none" stroke="#ff2ec4" stroke-width="2" opacity="0.55"/>
  <!-- Horizon lines (sunset) -->
  <g filter="url(#vn-b-cyan)" stroke-linecap="round" fill="none">
    <path d="M86 352H349" stroke="#2de2ff" stroke-width="3.2"/>
    <path d="M102 368H333" stroke="#ff2ec4" stroke-width="2.4" filter="url(#vn-b-pink)"/>
    <path d="M118 384H317" stroke="#2de2ff" stroke-width="2" opacity="0.85"/>
    <path d="M136 400H299" stroke="#ff7ae0" stroke-width="1.6" opacity="0.7"/>
  </g>
  <!-- Larger pink palm (left) -->
  <g transform="translate(128,168)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#vn-b-pink)" stroke="#ff2ec4">
    <path d="M54 186C53 140 55 104 56 70" stroke-width="5"/>
    <path d="M56 86C22 64 2 74-6 104" stroke-width="4"/>
    <path d="M56 80C32 50 10 42-6 58" stroke-width="4"/>
    <path d="M56 86C90 64 110 74 118 104" stroke-width="4"/>
    <path d="M56 80C80 50 102 42 118 58" stroke-width="4"/>
    <path d="M56 96C36 96 22 110 18 128" stroke-width="3.2"/>
    <path d="M56 96C76 96 90 110 94 128" stroke-width="3.2"/>
  </g>
  <!-- Smaller teal palm (right) -->
  <g transform="translate(230,210)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#vn-b-cyan)" stroke="#2de2ff">
    <path d="M40 144C39 112 41 86 42 58" stroke-width="4"/>
    <path d="M42 70C18 54 4 62-2 84" stroke-width="3.2"/>
    <path d="M42 66C24 44 8 38-4 50" stroke-width="3.2"/>
    <path d="M42 70C66 54 80 62 86 84" stroke-width="3.2"/>
    <path d="M42 66C60 44 76 38 88 50" stroke-width="3.2"/>
    <path d="M42 80C28 80 18 90 16 104" stroke-width="2.6"/>
    <path d="M42 80C56 80 66 90 68 104" stroke-width="2.6"/>
  </g>
</svg>
