<svg xmlns="http://www.w3.org/2000/svg" width="435" height="600" viewBox="0 0 435 600" role="img" aria-labelledby="vn-title vn-desc">
  <title id="vn-title">Vice Nights card back</title>
  <desc id="vn-desc">Dark night playing-card back with neon pink and cyan trim and a simple horizon mark. Original Texas HODL artwork; no third-party marks.</desc>
  <defs>
    <linearGradient id="vn-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2ec4"/>
      <stop offset="0.48" stop-color="#2de2ff"/>
      <stop offset="1" stop-color="#ff2ec4"/>
    </linearGradient>
    <linearGradient id="vn-border-inner" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2de2ff"/>
      <stop offset="1" stop-color="#ff2ec4"/>
    </linearGradient>
    <radialGradient id="vn-glow-cyan" cx="50%" cy="18%" r="52%">
      <stop offset="0" stop-color="#2de2ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2de2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vn-glow-pink" cx="50%" cy="84%" r="56%">
      <stop offset="0" stop-color="#ff2ec4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff2ec4" stop-opacity="0"/>
    </radialGradient>
    <filter id="vn-neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="435" height="600" rx="36" fill="#07091a"/>
  <rect width="435" height="600" rx="36" fill="url(#vn-glow-cyan)"/>
  <rect width="435" height="600" rx="36" fill="url(#vn-glow-pink)"/>
